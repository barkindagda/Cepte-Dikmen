in('')}</div></main>`}function eventsView(){return `${header('Etkinlikler','home')}<main class="content"><p class="lead">Belediye projeleri, açık hava etkinlikleri ve kültürel organizasyonlar.</p><div class="list">${events.map(eventCard).join('')}</div></main>`}function eventDetail(){let e=events.find(x=>x.id===state.id)||events[0];return `${header('Etkinlik detay','events')}<main class="content"><div class="art" style="height:180px;width:calc(100% + 48px);margin:-18px -24px 25px;padding:20px;align-items:flex-end;display:flex;justify-content:space-between;background-image:linear-gradient(180deg,rgba(13,27,61,.12),rgba(13,27,61,.72)),url('${e.image}');background-size:cover;background-position:center;color:#fff"><span style="font-size:54px;line-height:1">${e.emoji}</span><b style="color:#fff;max-width:70%;text-align:right">${e.subtitle}</b></div><small>${e.date}</small><h2>${e.title}</h2><p class="lead" style="font-size:14px;line-height:1.7;margin:20px 0">${e.summary}</p><div class="info" style="margin:18px 0 10px"><div><span>Yer</span><b>${e.place}</b></div><div><span>Zaman</span><b>${e.time}</b></div></div><div class="rows"><h3>Program</h3>${e.highlights.map(item=>`<p style="margin:8px 0;line-height:1.5"><b style="display:block;line-height:1.5">${item}</b></p>`).join('')}</div><p class="lead" style="font-size:14px;line-height:1.7;margin-top:18px">${e.description}</p><button class="button soft" onclick="go('events')">Etkinliklere dön →</button></main>`}function article(){let n=news.find(x=>x[0]===state.id)||news[0];return `${header('Duyuru detayı','news')}<main class="content"><div class="art ${n[4]}" style="height:180px;width:calc(100% + 48px);margin:-18px -24px 25px;padding:20px;align-items:flex-end"><b>${n[3]}</b></div><small>${n[2]}</small><h2>${n[1]}</h2><p class="lead" style="font-size:14px;line-height:1.7;margin:20px 0">23 Ağustos Pazar günü Dikmen Belediyesi tarafından yürütülecek çalışma hakkında bilgilendirme. Tüm halkımızın bilgisine sunulur.</p><button class="button soft" onclick="go('news')">Tüm duyurulara dön</button></main>`}function notifications(){return `${header('Bildirimler')}<main class="content"><div class="intro"><p>Güncel gelişmeler burada</p><button class="text" onclick="state.notes.forEach(n=>n[3]=true);render()">Tümünü okundu işaretle</button></div>${state.notes.map((n,i)=>`<button class="notification" onclick="state.notes[${i}][3]=true;render()">${icon(i?'':'orange')}<main><b>${n[0]}</b><p>${n[1]}</p><small>${n[2]}</small></main>${n[3]?'':'●'}</button>`).join('')}</main>${nav()}`}function profile(){return `${header('Profilim')}<main class="content profile"><div class="profile-head"><div class="avatar">${initials(state.userName)}</div><div><h2>${state.userName}</h2><p class="lead">Demo hesap</p></div>${badge('Aktif')}</div><div class="profile-info"><p>☎ <span>+90 533 00 00 00</span></p><p>✉ <span>zeynep.ada@email.com</span></p><p>⌖ <span>Dikmen Merkez, Şht. Hasan Sokak No: 14</span></p></div><div class="settings">${[['⚙','Bildirim ayarları'],['▣','Gizlilik ve güvenlik'],['?','Yardım merkezi'],['☎','Belediye iletişim']].map(x=>`<button onclick="${x[1]==='Belediye iletişim'?"go('contact')":''}">${x[0]} ${x[1]} <span>→</span></button>`).join('')}</div></main>${nav()}${whatsappBtn()}`}function contact(){return `${header('Belediye iletişim','profile')}<main class="content"><div class="brand" style="margin:22px 0 13px"><span class="mark"><i></i></span>Cepte <b>Dikmen</b></div><p class="lead">Size yardımcı olmaktan mutluluk duyarız.</p><div class="contact-card">☎<main><small>Telefon</small><b>+90 (392) 228 88 00</b></main>→</div><div class="contact-card">✉<main><small>E-posta</small><b>info@dikmenbelediyesi.org</b></main>→</div><div class="contact-card">⌖<main><small>Adres</small><b>Dikmen Belediye Binası, Merkez Mahallesi</b></main></div><div class="summary"><b>Çalışma saatleri</b><p>Pazartesi – Cuma · 08.00 – 16.00</p></div><button class="button">Bizi arayın ☎</button></main>`}function render(){let view={login,home,services,bills:billsView,bill:billView,pay,success,receipt,jobs:jobsView,job:jobView,apply,applied,requests,create,ticketSuccess,ticket,feedback,news:newsView,events:eventsView,event:eventDetail,article,notifications,profile,contact}[state.screen]||home;document.querySelector('#app').innerHTML=`<div class="frame"><div class="screen">${view()}</div></div>`}setTimeout(render,1600);document.querySelector('#app').innerHTML='<div class="splash"><div class="brand"><span class="mark"><i></i></span>Cepte <b>Dikmen</b></div><p>Dikmen Belediyesi dijital hizmetleri</p><span class="loader"></span></div>';
</script></body></html>
